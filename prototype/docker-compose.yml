services:
  db:
    image: postgres:16
    container_name: motel_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-motel_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-motel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: motel_backend
    restart: always
    environment:
      # La aplicacion usa el rol motel_app (db/init.sql), que no es dueno de las tablas ni puede deshabilitar triggers.
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-motel_app}:${APP_DB_PASSWORD:-motel_app}@db:5432/${POSTGRES_DB:-motel_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SQL_ECHO: ${SQL_ECHO:-False}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: motel_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
