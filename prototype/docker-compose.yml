services:
  db:
    image: postgres:16
    container_name: motel_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-motel_db}
    ports:
      # Solo desde la propia máquina: la base no se expone a la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Las migraciones se aplican en orden numérico, con el usuario dueño, al crear la base vacía.
      - ./db/migraciones:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-motel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: motel_backend
    restart: always
    environment:
      # La aplicación usa el rol motel_app (db/migraciones), que no es dueño de las tablas ni puede
      # deshabilitar triggers, crear operadores ni modificar arqueos.
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-motel_app}:${APP_DB_PASSWORD:-motel_app}@db:5432/${POSTGRES_DB:-motel_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SQL_ECHO: ${SQL_ECHO:-False}
      # RNF-04: clave de firma de las sesiones y cookie solo por HTTPS en producción.
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-False}
      ENTORNO: ${ENTORNO:-desarrollo}
      # Fondo de cambio de cada caja, en pesos (acta del 19/10/2026, punto 5).
      FONDO_INICIAL_CAJA: ${FONDO_INICIAL_CAJA:-25000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: motel_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      # Docker Desktop en Windows no avisa los cambios de archivos de la carpeta montada: Vite los sondea.
      VITE_USE_POLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Tareas de administración con el usuario dueño de las tablas (alta de operadores, datos de
  # demostración). No corre con la aplicación: se invoca con `docker compose run --rm admin ...`.
  # La API nunca recibe estas credenciales.
  admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["admin"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-motel_db}
      JWT_SECRET: no-se-usa-en-tareas-de-administracion
      DEMO_CLAVE_GERENCIA: ${DEMO_CLAVE_GERENCIA:-}
      DEMO_CLAVE_CONSERJES: ${DEMO_CLAVE_CONSERJES:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    entrypoint: ["python", "-m"]
    command: ["scripts.cargar_demo"]

volumes:
  pgdata:
