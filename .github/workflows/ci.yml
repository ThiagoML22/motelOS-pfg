name: CI / CD Pipeline

on:
  push:
    branches:
      - main
      # Rama de integración del prototipo v2 (AE3): cada etapa entra por una solicitud de cambios.
      - ae3/v2
  pull_request:
    branches:
      - main
      - ae3/v2

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: motel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./prototype/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: prototype/backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check app/ --ignore B008,EXE002

      - name: Run Pytest
        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/motel_test"
        run: PYTHONPATH=. python -m pytest app/tests/ -v

      - name: Aplicar migraciones y verificar inmutabilidad (RN-RES-01)
        working-directory: ./prototype
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE motel_schema;"
          for m in db/migraciones/*.sql; do
            echo "Aplicando $m"
            psql -h localhost -U postgres -d motel_schema -v ON_ERROR_STOP=1 -q -f "$m"
          done
          psql -h localhost -U postgres -d motel_schema -v ON_ERROR_STOP=1 -f db/verify_inmutabilidad.sql

      - name: Verificar permisos del rol de la aplicación (RNF-01, RNF-04, RNF-08)
        working-directory: ./prototype
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d motel_schema -v ON_ERROR_STOP=1 -f db/verify_roles.sql

      - name: Verificar el cierre de caja en la base (RF-08, RF-09, RF-14, RN-RES-02, RN-DER-03, RN-DER-04)
        working-directory: ./prototype
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d motel_schema -v ON_ERROR_STOP=1 -f db/verify_caja.sql

      - name: Verificar la migración desde una base v1.2 con datos
        working-directory: ./prototype
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE motel_migracion;"
          psql -h localhost -U postgres -d motel_migracion -v ON_ERROR_STOP=1 -q -f db/migraciones/001_esquema_v1.sql
          psql -h localhost -U postgres -d motel_migracion -v ON_ERROR_STOP=1 -q -v fase=antes -f db/verify_migracion_datos_v1.sql
          for m in db/migraciones/*.sql; do
            [ "$(basename "$m")" = "001_esquema_v1.sql" ] && continue
            psql -h localhost -U postgres -d motel_migracion -v ON_ERROR_STOP=1 -q -f "$m"
          done
          psql -h localhost -U postgres -d motel_migracion -v ON_ERROR_STOP=1 -v fase=despues -f db/verify_migracion_datos_v1.sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./prototype/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./prototype/frontend/package-lock.json

      - name: Install NPM Packages
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
